<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Data Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>Stock Data Visualizer</h1>
      <p class="subtitle">
        Load a CSV file where the first column is a date and the second column is a stock price.
        The data renders as an interactive line chart — hover to see a point, or click and drag
        to compare the change between two dates.
      </p>
    </header>

    <div class="controls">
      <label class="file-upload">
        <input type="file" id="csv-input" accept=".csv,text/csv">
        <span id="file-label">Choose CSV file</span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="log-toggle">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-text">Log scale</span>
      </label>

      <label class="date-field">
        <span class="date-field-label">Start</span>
        <input type="date" id="start-date">
      </label>

      <label class="date-field">
        <span class="date-field-label">End</span>
        <input type="date" id="end-date">
      </label>
    </div>

    <div class="chart-card">
      <div class="readout hidden" id="readout">
        <div class="readout-top">
          <span class="readout-price" id="readout-price"></span>
          <span class="readout-change" id="readout-change"></span>
          <span class="readout-cagr" id="readout-cagr"></span>
        </div>
        <div class="readout-date" id="readout-date"></div>
      </div>
      <div class="chart-empty" id="chart-empty">Upload a CSV to see the chart</div>
      <svg class="chart hidden" id="chart"></svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
